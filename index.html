<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Knutselkamer in 3D</title>
    <meta name="description" content="De knutselkamer, nagebouwd in 3D op basis van een iPhone LiDAR-scan. Draai de kamer rond en verschuif de meubels." />
    <style>
      html, body { background: #141414; height: 100%; margin: 0; overflow: hidden; font: 14px/1.35 system-ui, sans-serif; color: #fff; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #loader { pointer-events: none; position: fixed; top: 50%; left: 50%; width: 180px; height: 3px; border-radius: 2px; overflow: hidden; background: #ffffff1f; transform: translate(-50%, -50%); transition: opacity 0.5s; }
      #loader div { height: 100%; width: 40%; background: #ff9d4d; animation: slide 1.1s ease-in-out infinite alternate; }
      #loader.done, #loader.failed { opacity: 0; }
      @keyframes slide { from { transform: translateX(-20%); } to { transform: translateX(170%); } }
      .pill { background: #141414b8; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid #ffffff33; border-radius: 999px; }
      #hint { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%); max-width: calc(100% - 32px); box-sizing: border-box; padding: 8px 16px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
      #hint.shown { opacity: 1; }
      #selection { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); margin: 0 auto; width: fit-content; max-width: calc(100% - 32px); box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 10px 10px 10px 20px; border-radius: 18px; }
      #selection[hidden], #reset[hidden] { display: none; }
      #selection-name { font-weight: 600; }
      #selection-size { color: #ffffffb3; font-variant-numeric: tabular-nums; }
      button { font: inherit; color: #fff; cursor: pointer; background: #ffffff1f; border: 1px solid #ffffff40; border-radius: 999px; padding: 9px 16px; min-height: 40px; white-space: nowrap; }
      button:hover { background: #ffffff33; }
      button:focus-visible { outline: 2px solid #ff9d4d; outline-offset: 2px; }
      #reset { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top)); background: #141414b8; }
      #walk { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); background: #141414b8; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
      .ready #walk { opacity: 1; pointer-events: auto; }
      #stick { display: none; position: fixed; left: 24px; bottom: calc(40px + env(safe-area-inset-bottom)); width: 112px; height: 112px; border-radius: 50%; background: #14141459; border: 1px solid #ffffff59; touch-action: none; }
      #stick div { position: absolute; left: 34px; top: 34px; width: 44px; height: 44px; border-radius: 50%; background: #ffffffbf; }
      @media (pointer: coarse) { .walking #stick { display: block; } }
      .walking #reset { display: none; }
      #frames { position: fixed; left: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 11px; color: #ffffff73; font-variant-numeric: tabular-nums; pointer-events: none; }
      #selection-note { color: #ffc48f; max-width: 34ch; }
      #selection-note:empty, #variant[hidden], #fold[hidden], #parts[hidden] { display: none; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
      #facts { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top)); width: 248px; max-width: calc(100% - 32px); box-sizing: border-box; border-radius: 16px; padding: 4px 4px 10px; background: #141414b8; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid #ffffff33; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
      .ready #facts { opacity: 1; pointer-events: auto; }
      #facts { max-height: calc(100% - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain; }
      #facts.collapsed { width: auto; padding-bottom: 4px; border-radius: 999px; }
      #facts.collapsed #facts-body { display: none; }
      #facts-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: none; border: 0; font-weight: 600; padding: 8px 12px; min-height: 36px; }
      #facts-toggle:hover { background: #ffffff1a; }
      #facts-toggle svg { transition: transform 0.2s; }
      #facts-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }
      #facts h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #ffffff80; margin: 10px 12px 4px; }
      #facts dl { margin: 0 12px; display: grid; grid-template-columns: 1fr auto; row-gap: 2px; }
      #facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      #facts dt span { color: #ffffff80; }
      #facts-levels, #facts-arrangements, .level-parts { list-style: none; margin: 0; padding: 0; }
      .swatch.round { border-radius: 50%; align-self: start; margin-top: 4px; }
      .arrangement { white-space: normal; }
      .arrangement .level-name { display: block; }
      .arrangement-note { display: block; font-size: 12px; color: #ffffffa6; }
      .arrangement-note:empty { display: none; }
      #facts-levels, #facts-arrangements { padding: 0 4px; }
      .level { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; text-align: left; background: none; border: 1px solid transparent; border-radius: 10px; padding: 5px 8px; min-height: 34px; }
      .level:hover { background: #ffffff14; }
      .level[aria-pressed="true"] { background: #ff9d4d26; border-color: #ff9d4d80; }
      .level-area { font-variant-numeric: tabular-nums; }
      .swatch { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid #ff9d4d; box-sizing: border-box; }
      .level[aria-pressed="true"] .swatch { background: #ff9d4d; }
      .level-parts { margin: 2px 0 6px 26px; padding-right: 8px; font-size: 12px; color: #ffffffb3; }
      .level-parts li { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
      button.small { font-size: 13px; min-height: 32px; padding: 5px 12px; }
      #copy-layout { margin: 6px 12px 0; }
      #hidden-list { list-style: none; margin: 0; padding: 0 12px; }
      #hidden-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0; }
      #facts-hidden[hidden] { display: none; }
      @media (max-width: 980px) { #hint { top: auto; bottom: calc(92px + env(safe-area-inset-bottom)); } }
      @media (max-width: 560px) { #facts { width: 208px; font-size: 13px; } #selection { flex-wrap: wrap; } }
      @media (prefers-reduced-motion: reduce) { #loader div { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="De knutselkamer in 3D. Sleep om te draaien, scroll of knijp om te zoomen, klik op een meubel om het te verplaatsen."></canvas>
    <div id="loader"><div></div></div>
    <div id="hint" class="pill" role="status"></div>
    <div id="frames" aria-hidden="true"></div>
    <button id="reset" type="button" hidden>Zet indeling terug</button>
    <button id="walk" type="button">Rondlopen</button>
    <div id="stick"><div></div></div>
    <section id="facts" aria-label="Maten van de kamer">
      <button id="facts-toggle" type="button" aria-expanded="true" aria-controls="facts-body">
        Maten
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <div id="facts-body">
        <h2>Kamer, binnenwerks</h2>
        <dl>
          <dt>Breedte <span>raamwand</span></dt><dd id="room-width"></dd>
          <dt>Lengte</dt><dd id="room-length"></dd>
          <dt>Hoogte</dt><dd id="room-height"></dd>
        </dl>
        <h2>Indeling</h2>
        <ul id="facts-arrangements"></ul>
        <button id="copy-layout" type="button" class="small">Kopieer indeling</button>
        <h2>Oppervlak</h2>
        <ul id="facts-levels"></ul>
        <div id="facts-hidden" hidden>
          <h2>Verborgen</h2>
          <ul id="hidden-list"></ul>
        </div>
      </div>
    </section>
    <div id="selection" class="pill" hidden>
      <div>
        <div id="selection-name"></div>
        <div id="selection-size"></div>
        <div id="selection-note" role="status"></div>
      </div>
      <div class="actions">
        <button id="rotate" type="button">Kwartslag draaien</button>
        <button id="variant" type="button" hidden></button>
        <button id="fold" type="button" hidden></button>
        <button id="parts" type="button" hidden></button>
        <button id="hide" type="button">Verbergen</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
